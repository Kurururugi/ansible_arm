---
- name: Installation MegaCli
  hosts: arm
  become: yes
  become_user: root
  vars:
    iso_name: installation-1.8.5.46-11.02.26_01.30-di.iso
    project_dir: /usr/local/Project
    install_dir: /usr/local/Project/install
    repository_dir: /usr/local/alse
  tasks:

### install MegaCli ###

    - name: copy MegaCli.zip
      copy:
        src: '{{ install_dir }}/8-07-14_MegaCLI.zip'
        dest: /usr/local/Project/install/
        owner: root
        group: root
        mode: '0644'

    - name: unzip MegaCLI.zip
      shell: 'sudo unzip {{ install_dir }}/8-07-14_MegaCLI.zip -d {{ install_dir }}/megacli'

    - name: delete MegaCLI.zip
      shell: 'sudo rm {{ install_dir }}/8-07-14_MegaCLI.zip'

    - name: copy alien.tar
      copy:
        src: '{{ install_dir }}/alien.tar'
        dest: /usr/local/Project/install/
        owner: root
        group: root
        mode: '0644'

    - name: untar alien.tar
      shell: 'sudo tar -C {{ install_dir }} -xvf {{ install_dir }}/alien.tar'

    - name: delete alien.tar
      shell: 'sudo rm {{ install_dir }}/alien.tar'

    - name: copy libncurses5.tar
      copy:
        src: '{{ install_dir }}/libncurses5.tar'
        dest: /usr/local/Project/install/
        owner: root
        group: root
        mode: '0644'

    - name: untar libncurses5.tar
      shell: 'sudo tar -C {{ install_dir }} -xvf {{ install_dir }}/libncurses5.tar'

    - name: delete libncurses5.tar
      shell: 'sudo rm {{ install_dir }}/libncurses5.tar'

    - name: install alien
      shell: 'sudo dpkg -i {{ install_dir }}/alien/*.deb'

    - name: install libncurses5
      shell: 'sudo dpkg -i {{ install_dir }}/libncurses5/*.deb'

    - name: convert MegaCli-8.07.14-1.noarch.rpm
      command: alien MegaCli-8.07.14-1.noarch.rpm
      args:
        chdir: /usr/local/Project/install/megacli/Linux

    - name: install MegaCli
      shell: 'sudo dpkg -i {{ install_dir }}/megacli/Linux/*.deb'

    - name: create link for megacli
      shell: 'sudo ln -s /opt/MegaRAID/MegaCli/MegaCli64 /usr/bin/megacli'

    - name: delete directory megacli
      shell: 'sudo rm -rf {{ install_dir }}/megacli'

    - name: delete directory alien
      shell: 'sudo rm -rf {{ install_dir }}/alien'

    - name: delete directory libncurses5
      shell: 'sudo rm -rf {{ install_dir }}/libncurses5'

    - name: create /usr/local/Project/raid_state
      shell: 'sudo touch /usr/local/Project/raid_state'

    - name: copy RAID.sh
      copy:
        src: '{{ project_dir }}/scripts/shell/RAID.sh'
        dest: /usr/local/Project/
        owner: root
        group: root
        mode: '0755'

    - name: run script raid_state.sh
      script: '{{ project_dir }}/scripts/python/raid_state.py'

    - name: astra-nochmodx-lock enable
      script: /usr/local/Project/scripts/shell/enable_chmodx.sh

...
