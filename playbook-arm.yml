---
- name: ARM Settings
  hosts: arm
  become: yes
  become_user: root
  vars:
    iso_name: installation-1.8.5.46-11.02.26_01.30-di.iso
    project_dir: /usr/local/Project
    install_dir: /usr/local/Project/install
    repository_dir: /usr/local/alse
  tasks:

### create directores for new project ###

    - name: create directory /usr/local/Project
      ansible.builtin.file:
        path: '{{ install_dir }}'
        state: directory
        mode: 'u=rwX,g=rX,o=rX'
        recurse: yes
        force: yes

### install ConfigUpdater-3.2.tar.gz for python3 ###

    - name: unarchive ConfigUpdater-3.2.tar.gz
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/ConfigUpdater-3.2.tar.gz'
        dest: '{{ install_dir }}'
        owner: root
        group: root
        mode: u=rwX,g=rX,o=rX

    - name: install ConfigUpdater-3.2
      ansible.builtin.command:
        cmd: 'python3 setup.py install'
        chdir: '{{ install_dir }}/ConfigUpdater-3.2'

    - name: delete /usr/local/Project/install/ConfigUpdater-3.2
      ansible.builtin.file:
        path: '{{ install_dir }}/ConfigUpdater-3.2'
        state: absent

### install lxml 6.0.2 ###

    - name: untar lib_for_lxml.tar
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/lib_for_lxml.tar'
        dest: '{{ install_dir }}'
        owner: root
        group: root
        mode: 'u=rwX,g=rX,o=rX'

    - name: install lib for lxml
      ansible.builtin.shell: 
        cmd: 'dpkg -i {{ install_dir }}/lib_for_lxml/*.deb'

    - name: delete install directory lib for lxml
      ansible.builtin.file:
        path: '{{ install_dir }}/lib_for_lxml'
        state: absent

    - name: untar lxml-6.0.2.tar.gz
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/lxml-6.0.2.tar.gz'
        dest: '{{ install_dir }}'
        owner: root
        group: root
        mode: u=rwX,g=rX,o=rX

    - name: build lxml-6.0.2
      ansible.builtin.command:
        cmd: 'python3 setup.py build'
        chdir: /usr/local/Project/install/lxml-6.0.2

    - name: install lxml-6.0.2
      ansible.builtin.command: 
        cmd: 'python3 setup.py install'
        chdir: '{{ install_dir }}/lxml-6.0.2'

    - name: delete diretory lxml-6.0.2
      ansible.builtin.file:
        path: '{{ install_dir }}/lxml-6.0.2'
        state: absent

### create local repository ###

    - name: copy iso
      ansible.builtin.copy:
        src: '{{ install_dir }}/{{ iso_name }}'
        dest: '{{ install_dir }}/{{ iso_name }}'

    - name: create directory /mnt/iso
      ansible.builtin.file:
        path: '/mnt/iso'
        state: directory
        mode: '0755'

    - name: mount iso
      ansible.posix.mount:
        path: /mnt/iso
        src: '{{ install_dir }}/{{ iso_name }}'
        fstype: iso9660
        opts: loop,ro
        state: ephemeral

    - name: create repository dir
      ansible.builtin.file:
        path: '{{ repository_dir }}'
        state: directory
        mode: '0755'

    - name: create repository
      ansible.builtin.command: 
        cmd: 'cp -r /mnt/iso {{ repository_dir }}'

    - name: umount iso
      ansible.posix.mount:
        path: '/mnt/iso'
        state: unmounted

    - name: add repository
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/repository.py'

### xorg settings ###

    - name: run script xorg.sh
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/xorg.sh'

### copy iptables scripts ###

    - name: copy stop_iptables.sh
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/userscripts/stop_iptables.sh'
        dest: '{{ project_dir }}/stop_iptables.sh'
        owner: root
        group: root
        mode: '0755'

    - name: copy start_iptables.sh
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/userscripts/start_iptables.sh'
        dest: '{{ project_dir }}/start_iptables.sh'
        owner: root
        group: root
        mode: '0755'

    - name: copy nochmod_disable.sh
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/userscripts/nochmod_disable.sh'
        dest: '{{ project_dir }}/nochmod_disable.sh'
        owner: root
        group: root
        mode: '0755'

### default users settings ###

    - name: run script defaul_user_settings.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/defaul_user_settings.py'

    - name: run script keyshortcutrc.sh
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/keyshortcutrc.sh'

    - name: backup /usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk
      ansible.builtin.copy:
        src: '/usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk'
        dest: '/usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk.bak'
        remote_src: yes

    - name: copy ru_RU.UTF-8.miscrc.fly-kiosk
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/ru_RU.UTF-8.miscrc.fly-kiosk'
        dest: '/usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk'
        owner: root
        group: root
        mode: '0644'

### create new users ###

    - name: execute script create_users.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/create_users.py'

    - name: copy /home/operator_arm/.fly
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/operator_arm/.fly/'
        dest: '/home/operator_arm/.fly/'
        owner: operator_arm
        group: operator_arm
        directory_mode:

    - name: copy fly-kiosk for operator_arm
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/fly-kiosk/operator_arm/'
        dest: '/etc/fly-kiosk/operator_arm/'
        owner: root
        group: operator_arm
        directory_mode:

    - name: chown /etc/fly-kiosk/operator_arm/fly-kiosk.conf
      ansible.builtin.file:
        path: '/etc/fly-kiosk/operator_arm/fly-kiosk.conf'
        owner: root
        group: root

    - name: run script kiosk.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/kiosk.py'

    - name: PASS_MAX_DAYS for administrator
      ansible.builtin.command:
        cmd: 'chage -M 730 administrator'

    - name: PASS_MAX_DAYS for operator_arm
      ansible.builtin.command:
        cmd: 'chage -M 730 operator_arm'

    - name: execute script create_start_hmi.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/create_start_hmi.py'

    - name: copy /home/operator_arm/.config
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/operator_arm/.config/'
        dest: '/home/operator_arm/.config/'
        owner: operator_arm
        group: operator_arm
        directory_mode:

    - name: copy /home/administrator/.config/powermanagementprofilesrc
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/powermanagementprofilesrc'
        dest: '/home/administrator/.config/powermanagementprofilesrc'
        owner: administrator
        group: administrator
        mode: '0600'

    - name: copy /home/operator_arm/.config/powermanagementprofilesrc
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/powermanagementprofilesrc'
        dest: '/home/operator_arm/.config/powermanagementprofilesrc'
        owner: operator_arm
        group: operator_arm
        mode: '0600'

### audit settings ###

    - name: backup old logrotate.conf
      ansible.builtin.command:
        cmd: 'mv /etc/logrotate.conf /etc/logrotate.conf.bak'

    - name: copy logrotate.conf
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/logrotate.conf'
        dest: '/etc/logrotate.conf'
        owner: root
        group: root
        mode: '0644'

    - name: copy audit01.rules
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/audit01.rules'
        dest: '/etc/audit/rules.d/audit01.rules'
        owner: root
        group: root
        mode: '0644'

    - name: copy /etc/audit/files/auditd.conf
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/auditd.conf'
        dest: '/etc/audit/auditd.conf'
        owner: root
        group: root
        mode: '0644'

    - name: copy /etc/audit/5-exclude.rules
      ansible.builtin.copy:
        src: '{{ project_dir }}/files/5-exclude.rules'
        dest: '/etc/audit/rules.d/5-exclude.rules'
        owner: root
        group: root
        mode: '0644'

    - name: run script audit_astra_syslog.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/audit_astra_syslog.py'

    - name: create user's audit
      ansible.builtin.command:
        cmd: 'useraud -o 0:0'

    - name: create admin's audit
      ansible.builtin.command:
        cmd: 'useraud administrator 0:0'

    - name: restart auditd.service
      ansible.builtin.systemd:
        name: auditd
        state: restarted

    - name: logrotate settings
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/logrotate.py'

    - name: create file finalize audit
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/audit-finalize.sh'

### snmp ###

    - name: install snmpd
      ansible.builtin.apt:
        name: snmpd
        state: present

    - name: execute script snmpd.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/snmpd.py'

### chrony ###

    - name: install chrony
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: execute script chrony.py
      ansible.builtin.script: 
        cmd: '{{ project_dir }}/scripts/python/chrony.py'

### grub settings ###

    - name: grub settings
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/grub.py'

### ssh settings ###

    - name: ssh Settings
      script: '{{ project_dir }}/scripts/python/ssh.py'

### fscontrol ###

    - name: copy fscontrol files
      ansible.builtin.copy:
        src: '{{ install_dir }}/FSControl'
        dest: '{{ install_dir }}/'
        owner: root
        group: root
        mode: '0755'

    - name: install libicu70_70.1-2_amd64.deb
      ansible.builtin.command:
        cmd: 'dpkg -i {{ install_dir }}/FSControl/libicu70_70.1-2_amd64.deb'

    - name: install libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
      ansible.builtin.command:
        cmd: 'dpkg -i {{ install_dir }}/FSControl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb'

    - name: install FSControl.1.0.37.linux-x64.deb
      ansible.builtin.command:
        cmd: 'dpkg -i {{ install_dir }}/FSControl/FSControl.1.0.37.linux-x64.deb'

    - name: untar aspnetcore-runtime-8.0.13-linux-x64.tar.gz
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/FSControl/aspnetcore-runtime-8.0.13-linux-x64.tar.gz'
        dest: '/opt/FSControl'
        owner: root
        group: root
        mode: u=rwX,g=rX,o=rX
        remote_src: yes

    - name: chmod for /etc/systemd/system/FSControl.service
      ansible.builtin.file:
        path: '/etc/systemd/system/FSControl.service'
        mode: '0644'

    - name: run script fscontrol-service.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/fscontrol-service.py'

    - name: create directory /opt/FSControlUI
      ansible.builtin.file:
        path: '/opt/FSControlUI'
        state: directory
        mode: '0755'

    - name: FSControl.ElectronApp-2.0.0.AppImage in /opt/FSControlUI
      ansible.builtin.command:
        cmd: 'cp {{ install_dir }}/FSControl/FSControl.ElectronApp-2.0.0.AppImage /opt/FSControlUI/'

    - name: chmod FSControl.ElectronApp-2.0.0.AppImage
      ansible.builtin.file:
        path: '/opt/FSControlUI/FSControl.ElectronApp-2.0.0.AppImage'
        mode: '0755'

    - name: create group fscontrol
      ansible.builtin.command:
        cmd: 'groupadd fscontrol'

    - name: administrator in fscontrol group
      ansible.builtin.command:
        cmd: 'usermod -aG fscontrol administrator'

    - name: chmod /opt/FSControl/appsettings_unix.json
      ansible.builtin.file:
        path: '/opt/FSControl/appsettings_unix.json'
        mode: '0644'

    - name: run script fscontrol-json.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/fscontrol-json.py'

    - name: start and enable FSControl.service
      ansible.builtin.systemd:
        name: FSControl.service
        state: started
        enabled: yes

    - name: delete install directory FSControll
      ansible.builtin.file:
        path: '{{ install_dir }}/FSControl'
        state: absent

### clear bash history ###

    - name: run script rm_bash_history.sh
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/rm_bash_history.sh'

### visudo ###

    - name: run script visudo.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/visudo.py'

### usbguard ###

    - name: install usbguard
      ansible.builtin.apt:
        name: usbguard
        state: present

    - name: start and enable usbguard
      ansible.builtin.systemd:
        name: usbguard
        state: started
        enabled: yes

    - name: run script usdguard.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/usdguard.py'

    - name: run script usdguard_rule.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/usdguard_rule.py'

### disable autoupdate ###

    - name: run script disable_autoupdate.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/disable_autoupdate.py'

### delete autostart ###

    - name: run script autostart_arm.sh
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/autostart_arm.sh'

### disable IPv6  ###

    - name: run script sysctl.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/sysctl.py'

### pam.d settings ###

    - name: run script pam.py
      ansible.builtin.script:
        cmd: '/usr/local/Project/scripts/python/pam.py'

### admin settings ###

    - name: run script admin_settings.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/admin_settings.py'

### settings for virtual keyboard ###

    - name: run script fly-vkbd.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/fly-vkbd.py'

### autostart ###

    - name: run script fly-dmrc.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/fly-dmrc.py'

### disable sudo -i  ###

    - name: run script root.py
      ansible.builtin.script:
        cmd: '/usr/local/Project/scripts/python/root.py'

### kernel protect  ###

    - name: run kernel_protect.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/kernel_protect.py'

### checkOS  ###

    - name: copy /usr/local/Project/install/CheckOS_AstraLinux_v.2.4.3
      ansible.builtin.copy:
        src: '{{ install_dir }}/CheckOS_AstraLinux_v.2.4.3'
        dest: '/opt'
        owner: root
        group: root
        mode: '0755'

    - name: chmod +x checkOS
      ansible.builtin.file:
        path: '/opt/FSControl/appsettings_unix.json'
        mode: '0755'

### install kics ###

    - name: copy /usr/local/Project/install/kics/
      ansible.builtin.copy:
        src: '{{ install_dir }}/kics'
        dest: '{{ install_dir }}/'
        owner: root
        group: root
        mode: '0755'

    - name: install kics
      ansible.builtin.command:
        cmd: 'dpkg -i {{ install_dir }}/kics/kics_1.3.0-1206_amd64.deb'

    - name: create dir for update
      ansible.builtin.file:
        path: '/opt/kics_update'
        state: directory
        mode: '0755'

    - name: kics postinstall
      ansible.builtin.command:
        cmd: '/opt/kaspersky/kics/bin/kics-setup.pl --autoinstall={{ install_dir }}/kics/autoinstall.ini'

    - name: install kics-gui
      ansible.builtin.command:
        cmd: 'dpkg -i {{ install_dir }}/kics/kics-gui_1.3.0-1206_amd64.deb'

    - name: mv /opt/kaspersky/kics/lib64/libstdc++.so.6
      ansible.builtin.command:
        cmd: 'mv /opt/kaspersky/kics/lib64/libstdc++.so.6 /opt/kaspersky/kics/lib64/libstdc++.so.6.old'

    - name: kics settings
      ansible.builtin.command:
        cmd: 'kics-control --import-settings --file /usr/local/Project/install/kics/kics_1_3_ttr.ini'

    - name: run script kics_audit.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/kics_audit.py'

### install alpha.hmi ###

    - name: untar alpha.tar
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/alpha.tar'
        dest: '{{ install_dir }}'
        owner: root
        group: root
        mode: u=rwX,g=rX,o=rX

    - name: install alpha deb
      ansible.builtin.shell:
        cmd: 'dpkg -i {{ install_dir }}/AlphaPlatform/*.deb'

    - name: debconf setting for slapd
      ansible.builtin.debconf:
        name: slapd
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.type }}"
      loop:
        - { question: 'slapd/noconfiguration', value: 'false', type: 'boolean' }
        - { question: 'slapd/domain', value: 'maxcrc.com', type: 'string' }
        - { question: 'shared/organization', value: 'transneft', type: 'string' }
        - { question: 'slapd/password1', value: 'Bzpa/123456789', type: 'password' }
        - { question: 'slapd/password2', value: 'Bzpa/123456789', type: 'password' }
        - { question: 'slapd/purge_database', value: 'false', type: 'boolean' }
        - { question: 'slapd/backend', value: 'mdb', type: 'select' }
        - { question: 'slapd/move_old_database', value: 'true', type: 'boolean' }

    - name: install slapd and ldap-utils
      ansible.builtin.apt:
        name:
          - slapd
          - ldap-utils
        state: present
        update_cache: yes

    - name: run script alpha.security.schema.export.sh
      ansible.builtin.command:
        cmd: 'sh ./alpha.security.schema.export.sh'
        chdir: /opt/Automiq/Alpha.Security/

    - name: run script alpha.security.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/alpha.security.py'

    - name: ldapadd access.ldif
      ansible.builtin.command:
        cmd: 'ldapadd -Y EXTERNAL -H ldapi:/// -f access.ldif'
        chdir: '/opt/Automiq/Alpha.Security/'

    - name: restart and enabled OpenLDAP Service
      ansible.builtin.systemd:
        name: slapd
        state: restarted
        enabled: yes

    - name: run script alpha.security.ic.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/alpha.security.ic.py'

    - name: run script alpha_start_hmi.py
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/python/alpha_start_hmi.py'

    - name: mv libgcc_s.so.1
      ansible.builtin.command:
        cmd: 'mv /opt/Automiq/Alpha.HMI/corelib/libgcc_s.so.1 /opt/Automiq/Alpha.HMI/corelib/libgcc_s.so.1.bak'

    - name: mv libstdc++.so.6
      ansible.builtin.command:
        cmd: 'mv /opt/Automiq/Alpha.HMI/corelib/libstdc++.so.6 /opt/Automiq/Alpha.HMI/corelib/libstdc++.so.6.bak'

### other settings ###

    - name: run script other_settings.sh
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/other_settings.sh'

...
