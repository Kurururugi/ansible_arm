# Установка Kaspersky Industrial CyberSecurity for Nodes v1.3

    - name: Установка Kaspersky Industrial CyberSecurity for Nodes v1.3
      block:

        - name: Копирование установочных файлов Kaspersky Industrial CyberSecurity for Nodes v1.3
          ansible.builtin.copy:
            src: '{{ install_dir }}/kics'
            dest: '{{ install_dir }}/'
            owner: root
            group: root
            mode: '0755'
          tags: kics

        - name: Создание папки для хранения обновлений
          ansible.builtin.file:
            path: '/opt/kics_update'
            state: directory
            mode: '0755'
          tags: kics

        - name: Установка Kaspersky Industrial CyberSecurity for Nodes из deb-пакета
          ansible.builtin.command:
            cmd: 'dpkg -i {{ install_dir }}/kics/kics_1.3.0-1206_amd64.deb'
          tags: kics

        - name: Автоматическое завершение установки Kaspersky Industrial CyberSecurity for Nodes
          ansible.builtin.command:
            cmd: '/opt/kaspersky/kics/bin/kics-setup.pl --autoinstall={{ install_dir }}/kics/autoinstall.ini'
          tags: kics

        - name: Установка GUI для Kaspersky Industrial CyberSecurity for Nodes
          ansible.builtin.command:
            cmd: 'dpkg -i {{ install_dir }}/kics/kics-gui_1.3.0-1206_amd64.deb'
          tags: kics

        - name: Удаление библиотеки libstdc++.so.6.old
          ansible.builtin.command:
            cmd: 'mv /opt/kaspersky/kics/lib64/libstdc++.so.6 /opt/kaspersky/kics/lib64/libstdc++.so.6.old'
          tags: kics

        - name: Настройка задач Kaspersky Industrial CyberSecurity for Nodes
          ansible.builtin.command:
            cmd: 'kics-control --import-settings --file /usr/local/Project/install/kics/kics_1_3_ttr.ini'
          tags: kics

        - name: Выполнение скрипта kics_audit.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/kics_audit.py'
            executable: '{{ venv_path }}/bin/python3'
          tags: kics

        - name: Находим все файлы в директории /kics
          ansible.builtin.find:
            paths: '{{ install_dir }}/kics'
            file_type: file
            excludes: 'klnagent64_14.2.0-23324_amd64.deb'
          register: files_to_delete
          tags: kics

        - name: Удаление файлов из директории /kics
          ansible.builtin.file:
            path: '{{ item.path }}'
            state: absent
          loop: '{{ files_to_delete.files }}'
          tags: kics

# Установка Alpha.HMI

    - name: Установка Alpha.HMI
      block:

        - name: Распаковка установочного alpha.tar
          ansible.builtin.unarchive:
            src: '{{ install_dir }}/alpha.tar'
            dest: '{{ install_dir }}'
            owner: root
            group: root
            mode: 'u=rwX,g=rX,o=rX'
          tags: alpha

        - name: Установка deb-пакетов для Alpha.HMI
          ansible.builtin.shell:
            cmd: 'dpkg -i {{ install_dir }}/AlphaPlatform/*.deb'
          tags: alpha

        - name: Настройка debconf для службы slapd
          ansible.builtin.debconf:
            name: slapd
            question: "{{ item.question }}"
            value: "{{ item.value }}"
            vtype: "{{ item.type }}"
          loop:
            - { question: 'slapd/noconfiguration', value: 'false', type: 'boolean' }
            - { question: 'slapd/domain', value: 'maxcrc.com', type: 'string' }
            - { question: 'shared/organization', value: 'transneft', type: 'string' }
            - { question: 'slapd/password1', value: 'Bzpa/123456789', type: 'password' }
            - { question: 'slapd/password2', value: 'Bzpa/123456789', type: 'password' }
            - { question: 'slapd/purge_database', value: 'false', type: 'boolean' }
            - { question: 'slapd/backend', value: 'mdb', type: 'select' }
            - { question: 'slapd/move_old_database', value: 'true', type: 'boolean' }
          tags: alpha

        - name: Установка службы slapd и ldap-utils
          ansible.builtin.apt:
            name:
              - slapd
              - ldap-utils
            state: present
            update_cache: yes
          tags: alpha

        - name: Выполнение скрипта alpha.security.schema.export.sh
          ansible.builtin.command:
            cmd: 'sh ./alpha.security.schema.export.sh'
            chdir: /opt/Automiq/Alpha.Security/
          tags: alpha

        - name: Выполнение скрипта alpha.security.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/alpha.security.py'
            executable: '{{ venv_path }}/bin/python3'
          vars:
            ansible_ssh_extra_args: '-tt'
          tags: alpha

        - name: Применение шаблона access.ldif
          ansible.builtin.command:
            cmd: 'ldapadd -Y EXTERNAL -H ldapi:/// -f access.ldif'
            chdir: '/opt/Automiq/Alpha.Security/'
          tags: alpha

        - name: Перезапуск службы OpenLDAP Service
          ansible.builtin.systemd:
            name: slapd
            state: restarted
            enabled: yes
          tags: alpha

        - name: Выполнение скрипта alpha.security.ic.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/alpha.security.ic.py'
            executable: '{{ venv_path }}/bin/python3'
          tags: alpha

        - name: Выполнение скрипта alpha_start_hmi.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/alpha_start_hmi.py'
            executable: '{{ venv_path }}/bin/python3'
          tags: alpha

        - name: Удаление библиотеки libgcc_s.so.1
          ansible.builtin.command:
            cmd: 'mv /opt/Automiq/Alpha.HMI/corelib/libgcc_s.so.1 /opt/Automiq/Alpha.HMI/corelib/libgcc_s.so.1.bak'
          tags: alpha

        - name: Удаление библиотеки libstdc++.so.6
          ansible.builtin.command:
            cmd: 'mv /opt/Automiq/Alpha.HMI/corelib/libstdc++.so.6 /opt/Automiq/Alpha.HMI/corelib/libstdc++.so.6.bak'
          tags: alpha

        - name: Удаление установочной папки AlphaPlatform
          ansible.builtin.file:
            path: '{{ install_dir }}/AlphaPlatform'
            state: absent

#        - name: Выполнение скрипта /opt/Automiq/Alpha.Security/monitor.export.sh
#          ansible.builtin.command:
