---
- name: ARM Settings
  hosts: arm
  become: yes
  become_user: root
  vars:
    iso_name: installation-1.8.5.46-11.02.26_01.30-di.iso
    project_dir: /usr/local/Project
    install_dir: /usr/local/Project/install
    repository_dir: /usr/local/alse
    venv_path: /usr/local/Project/venv
  tasks:

# Подготовка для развертывания

    - name: Создание директории проекта
      ansible.builtin.file:
        path: '{{ project_dir }}'
        state: directory
        mode: 'u=rwX,g=rwX,o=rwX'

    - name: Создание дополнительных  директорий для нового проекта
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: 'u=rwX,g=rX,o=rX'
      loop:
        - '{{ install_dir }}'
        - '{{ repository_dir }}'
        - '/mnt/iso'

# Установка venv

    - name: Установка venv
      block:

        - name: Распаковка архива venv.tar
          ansible.builtin.unarchive:
            src: '{{ install_dir }}/venv.tar'
            dest: '{{ install_dir }}'
          tags: venv

        - name: Установка venv из deb-пакета
          ansible.builtin.shell:
            cmd: 'dpkg -i {{ install_dir }}/venv/*.deb'
          tags: venv

        - name: Создание виртуального окружения
          ansible.builtin.command:
            cmd: 'python3 -m venv {{ venv_path }}'
            creates: '{{ venv_path }}/bin/activate'
          tags: venv

        - name: Удаление временной директории venv
          ansible.builtin.file:
            path: '{{ install_dir }}/venv'
            state: absent
          tags: venv

# Создание локального репозитория

    - name: Создание локального репозитория
      block:

        - name: Копирование установочного iso-образа
          ansible.builtin.copy:
            src: '{{ install_dir }}/{{ iso_name }}'
            dest: '{{ install_dir }}/{{ iso_name }}'
            force: no

        - name: Монтирование iso-образа
          ansible.posix.mount:
            path: '/mnt/iso'
            src: '{{ install_dir }}/{{ iso_name }}'
            fstype: iso9660
            opts: loop,ro
            state: ephemeral

        - name: Копирование файлов с установочного носителя в локальный репозиторий
          ansible.builtin.command:
            cmd: 'cp -r /mnt/iso {{ repository_dir }}'

        - name: Размонтирование iso-образа
          ansible.posix.mount:
            path: '/mnt/iso'
            state: unmounted

        - name: Выполнение скрипта repository.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/repository.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Удаление установочного образа
          ansible.builtin.file:
            path: '{{ install_dir }}/{{ iso_name }}'
            state: absent

        - name: Установка службы пакетов make, perl
          ansible.builtin.apt:
            name:
              - make
              - perl
            state: present
            update_cache: yes

# Установка gcc

    - name: Распаковка установочного gcc.tar
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/gcc.tar'
        dest: '{{ install_dir }}'
        owner: root
        group: root
        mode: 'u=rwX,g=rX,o=rX'

    - name: Установка deb-пакета gcc
      ansible.builtin.shell:
        cmd: 'dpkg -i {{ install_dir }}/gcc/*.deb'

    - name: Удаление папки с исходниками gcc
      ansible.builtin.file:
        path: '{{ install_dir }}/gcc'
        state: absent

# Установка pip

    - name: Распаковка установочного pip.tar
      ansible.builtin.unarchive:
        src: '{{ install_dir }}/pip.tar'
        dest: '{{ install_dir }}'
        owner: root
        group: root
        mode: 'u=rwX,g=rX,o=rX'

    - name: Установка deb-пакетов для pip
      ansible.builtin.shell:
        cmd: 'dpkg -i {{ install_dir }}/pip/*.deb'

    - name: Удаление папки с исходниками pip
      ansible.builtin.file:
        path: '{{ install_dir }}/pip'
        state: absent

# Установка недостающих библиотек в venv

## ConfigUpdater-3.2

    - name: Установка библитеки ConfigUpdater
      block:

        - name: Разархивирование ConfigUpdater-3.2.tar.gz
          ansible.builtin.unarchive:
            src: '{{ install_dir }}/ConfigUpdater-3.2.tar.gz'
            dest: '{{ install_dir }}'
            owner: root
            group: root
            mode: 'u=rwX,g=rX,o=rX'
          tags: venv

        - name: Установка библиотеки ConfigUpdater-3.2 в venv
          ansible.builtin.command:
            cmd: '{{ venv_path }}/bin/python3 setup.py install'
            chdir: '{{ install_dir }}/ConfigUpdater-3.2'
          tags: venv

        - name: Удаление папки с исходниками ConfigUpdater
          ansible.builtin.file:
            path: '{{ install_dir }}/ConfigUpdater-3.2'
            state: absent
          tags: venv

## SystemdUnitParser-0.4

    - name: Копирование wheel-файла SystemdUnitParser-0.4
      ansible.builtin.copy:
        src: '{{ install_dir }}/systemdunitparser-0.4-py3-none-any.whl'
        dest: '{{ install_dir }}/systemdunitparser-0.4-py3-none-any.whl'
        mode: '0644'

    - name: Установка из wheel-файла SystemdUnitParser-0.4
      ansible.builtin.pip:
        name: '{{ install_dir }}/systemdunitparser-0.4-py3-none-any.whl'
        virtualenv: /usr/local/Project/venv
        state: present

    - name: Удаление установочного файла SystemdUnitParser-0.4
      ansible.builtin.file:
        path: '{{ install_dir }}/systemdunitparser-0.4-py3-none-any.whl'
        state: absent

## lxml-6.0.2

    - name: Установка библитеки lxml
      block:

        - name: Распаковка архива lib_for_lxml.tar
          ansible.builtin.unarchive:
            src: '{{ install_dir }}/lib_for_lxml.tar'
            dest: '{{ install_dir }}'
            owner: root
            group: root
            mode: 'u=rwX,g=rX,o=rX'
          tags: venv

        - name: Установка необходимых для lxml пакетов
          ansible.builtin.shell:
            cmd: 'dpkg -i {{ install_dir }}/lib_for_lxml/*.deb'
          tags: venv

        - name: Разархивирование архива lxml-6.0.2.tar.gz
          ansible.builtin.unarchive:
            src: '{{ install_dir }}/lxml-6.0.2.tar.gz'
            dest: '{{ install_dir }}'
            owner: root
            group: root
            mode: 'u=rwX,g=rX,o=rX'
          tags: venv

        - name: Сборка lxml с использованием venv
          ansible.builtin.command:
            cmd: '{{ venv_path }}/bin/python3 setup.py build'
            chdir: '{{ install_dir }}/lxml-6.0.2'
          tags: venv

        - name: Установка lxml с использованием venv
          ansible.builtin.command:
            cmd: '{{ venv_path }}/bin/python3 setup.py install'
            chdir: '{{ install_dir }}/lxml-6.0.2'
          tags: venv

        - name: Удаление директорий с исходниками
          ansible.builtin.file:
            path: '{{ item }}'
            state: absent
          loop:
            - '{{ install_dir }}/lxml-6.0.2'
            - '{{ install_dir }}/lib_for_lxml'
          tags: venv

# xorg settings

    - name: Выполнение скрипта xorg.sh
      ansible.builtin.script:
        cmd: '{{ project_dir }}/scripts/shell/xorg.sh'

# Копирование служебных скриптов

    - name: Копирование служебных скриптов
      block:
        - name: Копирование stop_iptables.sh
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/userscripts/stop_iptables.sh'
            dest: '{{ project_dir }}/stop_iptables.sh'
            owner: root
            group: root
            mode: '0755'

        - name: Копирование start_iptables.sh
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/userscripts/start_iptables.sh'
            dest: '{{ project_dir }}/start_iptables.sh'
            owner: root
            group: root
            mode: '0755'

        - name: Копирование nochmod_disable.sh
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/userscripts/nochmod_disable.sh'
            dest: '{{ project_dir }}/nochmod_disable.sh'
            owner: root
            group: root
            mode: '0755'

        - name: Копирование start_project
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/userscripts/start_project'
            dest: '/usr/local/bin/start_project'
            owner: root
            group: root
            mode: '0755'

# Настройки для пользователя по умолчанию

    - name: Выполнение настроек для пользователя по умолчанию
      block:

        - name: Выполнение скрипта defaul_user_settings.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/defaul_user_settings.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Выполнение скрипта keyshortcutrc.sh
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/shell/keyshortcutrc.sh'

        - name: Создание бэкапа ru_RU.UTF-8.miscrc.fly-kiosk
          ansible.builtin.copy:
            src: '/usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk'
            dest: '/usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk.bak'
            remote_src: yes

        - name: Копирование нового файла ru_RU.UTF-8.miscrc.fly-kiosk
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/ru_RU.UTF-8.miscrc.fly-kiosk'
            dest: '/usr/share/fly-wm/ru_RU.UTF-8.miscrc.fly-kiosk'
            owner: root
            group: root
            mode: '0644'

# Создание новых пользователей

    - name: Создание новых пользователей
      block:

        - name: Выполнение скрипта create_users.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/create_users.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Копирование папки /home/operator_arm/.fly
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/operator_arm/.fly/'
            dest: '/home/operator_arm/.fly/'
            owner: operator_arm
            group: operator_arm
            directory_mode:

        - name: Копирование папки /etc/fly-kiosk/operator_arm
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/fly-kiosk/operator_arm/'
            dest: '/etc/fly-kiosk/operator_arm/'
            owner: root
            group: operator_arm
            directory_mode:

        - name: Изменение прав для файла /etc/fly-kiosk/operator_arm/fly-kiosk.conf
          ansible.builtin.file:
            path: '/etc/fly-kiosk/operator_arm/fly-kiosk.conf'
            owner: root
            group: root

        - name: Выполнение скрипта kiosk.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/kiosk.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Установление PASS_MAX_DAYS для пользователя administrator
          ansible.builtin.command:
            cmd: 'chage -M 730 administrator'

        - name: Установление PASS_MAX_DAYS для пользователя operator_arm
          ansible.builtin.command:
            cmd: 'chage -M 730 operator_arm'

        - name: Выполнение скрипта create_start_hmi.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/create_start_hmi.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Копирование папки /home/operator_arm/.config
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/operator_arm/.config/'
            dest: '/home/operator_arm/.config/'
            owner: operator_arm
            group: operator_arm
            directory_mode:

        - name: Копирование файла /home/administrator/.config/powermanagementprofilesrc
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/powermanagementprofilesrc'
            dest: '/home/administrator/.config/powermanagementprofilesrc'
            owner: administrator
            group: administrator
            mode: '0600'

        - name: Копирование файла /home/operator_arm/.config/powermanagementprofilesrc
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/powermanagementprofilesrc'
            dest: '/home/operator_arm/.config/powermanagementprofilesrc'
            owner: operator_arm
            group: operator_arm
            mode: '0600'

# Настройки аудита и логирования

    - name: Настройки аудита и логирования
      block:

        - name: Создание резервной копии файла logrotate.conf
          ansible.builtin.command:
            cmd: 'mv /etc/logrotate.conf /etc/logrotate.conf.bak'

        - name: Копирование нового файла logrotate.conf
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/logrotate.conf'
            dest: '/etc/logrotate.conf'
            owner: root
            group: root
            mode: '0644'

        - name: Копирование файла правил 7-audit.rules
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/7-audit.rules'
            dest: '/etc/audit/rules.d/7-audit.rules'
            owner: root
            group: root
            mode: '0644'

        - name: Создание резервной копии файла auditd.conf
          ansible.builtin.command:
            cmd: 'mv /etc/audit/auditd.conf /etc/audit/auditd.conf.bak'

        - name: Копирование нового файла auditd.conf
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/auditd.conf'
            dest: '/etc/audit/auditd.conf'
            owner: root
            group: root
            mode: '0644'

        - name: Копирование файла правил 5-exclude.rules
          ansible.builtin.copy:
            src: '{{ project_dir }}/files/5-exclude.rules'
            dest: '/etc/audit/rules.d/5-exclude.rules'
            owner: root
            group: root
            mode: '0644'

        - name: Выполнение скрипта audit_astra_syslog.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/audit_astra_syslog.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Отключение настроек аудита для пользователей
          ansible.builtin.command:
            cmd: 'useraud -o 0:0'

        - name: Отключение настроек аудита для пользователя administrator
          ansible.builtin.command:
            cmd: 'useraud administrator 0:0'

        - name: Выполнение скрипта audit-finalize.sh
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/shell/audit-finalize.sh'

        - name: Перезапуск службы auditd.service
          ansible.builtin.systemd:
            name: auditd
            state: restarted

        - name: Выполнение скрипта logrotate.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/logrotate.py'
            executable: '{{ venv_path }}/bin/python3'

# Установка и настройка службы snmpd

    - name: Установка и настройка службы snmpd
      block:

        - name: Установка службы snmpd
          ansible.builtin.apt:
            name: snmpd
            state: present

        - name: Выполнение скрипта snmpd.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/snmpd.py'
            executable: '{{ venv_path }}/bin/python3'

# Установка и настройка службы chrony

    - name: Установка и настройка службы chrony
      block:

        - name: Установка службы chrony
          ansible.builtin.apt:
            name: chrony
            state: present

        - name: Выполнение скрипта script chrony.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/chrony.py'
            executable: '{{ venv_path }}/bin/python3'

# Настройка загрузчика GRUB

    - name: Настройка загрузчика GRUB
      block:

        - name: Выполнение скрипта grub.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/grub.py'

# Настройка службы SSH

    - name: Настройка службы ssh
      block:

        - name: Выполнение скрипта ssh.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/ssh.py'
            executable: '{{ venv_path }}/bin/python3'

# Установка и настройка службы FSControl

    - name: Установка и настройка службы FSControl
      block:

        - name: Копирование установочной папки для службы FSControl
          ansible.builtin.copy:
            src: '{{ install_dir }}/FSControl'
            dest: '{{ install_dir }}/'
            owner: root
            group: root
            mode: '0755'

        - name: Установка библиотеки libicu70_70.1-2_amd64.deb
          ansible.builtin.command:
            cmd: 'dpkg -i {{ install_dir }}/FSControl/libicu70_70.1-2_amd64.deb'

        - name: Установка библиотеки libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
          ansible.builtin.command:
            cmd: 'dpkg -i {{ install_dir }}/FSControl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb'

        - name: Установка пакета FSControl.1.0.37.linux-x64.deb
          ansible.builtin.command:
            cmd: 'dpkg -i {{ install_dir }}/FSControl/FSControl.1.0.37.linux-x64.deb'

        - name: Разархивирование архива aspnetcore-runtime-8.0.13-linux-x64.tar.gz
          ansible.builtin.unarchive:
            src: '{{ install_dir }}/FSControl/aspnetcore-runtime-8.0.13-linux-x64.tar.gz'
            dest: '/opt/FSControl'
            owner: root
            group: root
            mode: 'u=rwX,g=rX,o=rX'
            remote_src: yes

        - name: Изменение прав для службы FSControl.service
          ansible.builtin.file:
            path: '/etc/systemd/system/FSControl.service'
            mode: '0644'

        - name: Выполнение скрипта fscontrol-service.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/fscontrol-service.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Создание директории /opt/FSControlUI
          ansible.builtin.file:
            path: '/opt/FSControlUI'
            state: directory
            mode: '0755'

        - name: Копирование файла FSControl.ElectronApp-2.0.0.AppImage в /opt/FSControlUI
          ansible.builtin.copy:
            src: '{{ install_dir }}/FSControl/FSControl.ElectronApp-2.0.0.AppImage'
            dest: '/opt/FSControlUI/'
            remote_src: yes

        - name: Изменение прав для фаайла FSControl.ElectronApp-2.0.0.AppImage
          ansible.builtin.file:
            path: '/opt/FSControlUI/FSControl.ElectronApp-2.0.0.AppImage'
            mode: '0755'

        - name: Создание группы fscontrol
          ansible.builtin.command:
            cmd: 'groupadd fscontrol'

        - name: Добавление пользователя administrator в группу fscontrol
          ansible.builtin.command:
            cmd: 'usermod -aG fscontrol administrator'

        - name: Изменение прав для файла /opt/FSControl/appsettings_unix.json
          ansible.builtin.file:
            path: '/opt/FSControl/appsettings_unix.json'
            mode: '0644'

        - name: Выполнение скрипта fscontrol-json.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/fscontrol-json.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Запуск службы FSControl.service
          ansible.builtin.systemd:
            name: FSControl.service
            state: started
            enabled: yes

        - name: Удаление инсталяционной папки FSControl
          ansible.builtin.file:
            path: '{{ install_dir }}/FSControl'
            state: absent

# Очистка истории интерпритатора

    - name: Очистка истории интерпритатора
      block:

        - name: Выполнение скрипта rm_bash_history.sh
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/shell/rm_bash_history.sh'

# Редактирование visudo

    - name: Редактирование visudo
      block:

        - name: Выполнение скрипта visudo.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/visudo.py'
            executable: '{{ venv_path }}/bin/python3'

# Установка и настрока службы usbguard

    - name: Установка и настрока службы usbguard
      block:

        - name: Установка службы usbguard
          ansible.builtin.apt:
            name: usbguard
            state: present

        - name: Старт слжбы usbguard
          ansible.builtin.systemd:
            name: usbguard
            state: started
            enabled: yes

        - name: Выполнение скрипта usdguard.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/usdguard.py'
            executable: '{{ venv_path }}/bin/python3'

        - name: Выполнение скрипта usdguard_rule.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/usdguard_rule.py'
            executable: '{{ venv_path }}/bin/python3'

# Отключение автообновления

    - name: Отключение автообновления
      block:

        - name: Выполнение скрипта disable_autoupdate.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/disable_autoupdate.py'
            executable: '{{ venv_path }}/bin/python3'

# Удаление ненужных ярлыков из автозагрузки

    - name: Удаление ненужных ярлыков из автозагрузки
      block:

        - name: Выполнение скрипта autostart_arm.sh
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/shell/autostart_arm.sh'

# Отключение IPv6


    - name: Отключение IPv6
      block:

        - name: Выполнение скрипта sysctl.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/sysctl.py'
            executable: '{{ venv_path }}/bin/python3'

# Настройка модуля pam

    - name: Настройка модуля pam
      block:

        - name: Выполнение скрипта script pam.py
          ansible.builtin.script:
