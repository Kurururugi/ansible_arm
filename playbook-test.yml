---
- name: ARM Settings
  hosts: arm
  become: yes
  become_user: root
  vars:
    iso_name: installation-1.8.5.46-11.02.26_01.30-di.iso
    project_dir: /usr/local/Project
    install_dir: /usr/local/Project/install
    repository_dir: /usr/local/alse
    venv_path: /usr/local/Project/venv
  tasks:

        - name: Выполнение скрипта alpha.security.py
          ansible.builtin.script:
            cmd: '{{ project_dir }}/scripts/python/alpha.security.py'
            executable: '{{ venv_path }}/bin/python3'
          vars:
            ansible_ssh_extra_args: '-tt'  # ПРИНУДИТЕЛЬНО выделить TTY
          environment:
            PYTHONUNBUFFERED: '1'

...
